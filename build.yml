name: Build MythMC Plugin

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compila il Plugin con Maven
      run: mvn -B package --file pom.xml

    - name: Carica il file JAR scaricabile
      uses: actions/upload-artifact@v3
      with:
        name: MythMC-Plugin
        path: target/*.jar
